# S1 batch 1, data stage: GBIF multi-species downloads (resumable, state on the release species-pilot-data as s1_state.json), cleaning to 1/24 degree
# cells, native-range inputs (WCVP, GRIIS), final occurrence assets s1_*. Species list: data/species/batch1.csv.
# Trigger: push a change to .github/run/s1-w2 with [acquire], [native] and/or [assemble] in the commit message (assemble after the other two are done).
# Secrets reach only the acquire step; nothing prints them. Pilot assets are never replaced (all names start with s1_).
name: s1-w2
on:
  push:
    paths: [".github/run/s1-w2"]
  workflow_dispatch:
    inputs:
      stage:
        description: "acquire | native | assemble"
        type: string
        default: "acquire"
permissions:
  contents: write
env:
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  S1_WORK: ${{ github.workspace }}/work/s1
jobs:
  acquire:
    concurrency: { group: s1-w2-acquire, cancel-in-progress: false }
    if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'acquire') || contains(github.event.head_commit.message, '[acquire]')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pyarrow
      - name: Request, wait, fetch, split by species, clean, store (resumable)
        env:
          GBIF_USER: ${{ secrets.GBIF_USER }}
          GBIF_PWD: ${{ secrets.GBIF_PWD }}
          GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}
        run: |
          if grep -qw redo .github/run/s1-w2; then export S1_REDO=1; fi
          python -m ctw.species.s1run acquire --hours 5.6
      - name: State (keys and DOIs, no secrets)
        if: always()
        run: |
          cat work/s1/acquire_summary.json || true
          python - <<'PY'
          import json
          d=json.load(open("work/s1/s1_state.json"))
          print(json.dumps({k:{x:v.get(x) for x in ("key","doi","records","status","processed")} for k,v in d.items() if not k.startswith("_")}))
          PY
  native:
    concurrency: { group: s1-w2-native, cancel-in-progress: false }
    if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'native') || contains(github.event.head_commit.message, '[native]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pyarrow
      - name: WCVP native areas and GRIIS rows for the batch species
        run: python -m ctw.species.s1run native
  assemble:
    concurrency: { group: s1-w2-assemble, cancel-in-progress: false }
    if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'assemble') || contains(github.event.head_commit.message, '[assemble]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pyarrow
      - name: Masks, flags, target-group lookup, publish assets
        run: python -m ctw.species.s1run assemble
      - run: |
          python - <<'PY'
          import json
          m=json.load(open("work/s1/final/s1_manifest_w2_v1.json")); print(json.dumps({k:v["bytes"] for k,v in m["files"].items()}))
          r=json.load(open("work/s1/final/s1_w2_report_v1.json"))["species"]
          for s,x in r.items():
              n=x.get("native_mask") or {}
              print(s, "|", x.get("records"), "records |", x.get("n_cells"), "cells |", n.get("cells_kept"), "kept |", n.get("cells_removed"), "removed |", n.get("source"))
          PY
        if: always()
