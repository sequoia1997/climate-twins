# Spike E: probe GloBI and other interaction/trait data endpoints (research only, no repo outputs).
name: Spike E probe 3
on:
  push:
    paths: [".github/run/spike-e"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Probe
        run: python -u spikes/e/probe3.py 2>&1 | tee probe3.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: spike-e-probe3, path: probe3.log }
