# Temporary: reads CHELSA's datasets page to find where the files are hosted now. Deleted after use.
name: Probe CHELSA datasets page
on:
  push:
    paths: [".github/workflows/probe-chelsa2.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read the page
        run: |
          set +e
          curl -sL -m 40 https://www.chelsa-climate.org/datasets -o /tmp/d.html; echo "page bytes: $(wc -c </tmp/d.html)"
          echo "== every link/URL on the page"
          grep -o 'https\?://[A-Za-z0-9._/~%?=&#:+-]*' /tmp/d.html | sort -u | grep -v "instagram\|linkedin\|youtube\|bsky\|tina.io\|fonts\.\|w3\.org" | head -80
          echo "== visible text mentioning download/climatolog/1981/1991/V2/envicloud"
          sed 's/<[^>]*>/\n/g' /tmp/d.html | grep -i "download\|climatolog\|1981\|1991\|V\.\?2\|envicloud\|s3\|bucket\|url" | sort -u | head -60
          echo "== next data (json) blobs"
          grep -o '"href":"[^"]*"' /tmp/d.html | sort -u | head -60
          echo "== dataset sub-pages"
          for u in $(grep -o 'href="/datasets/[^"]*"' /tmp/d.html | sed 's/href="//;s/"//' | sort -u | head -8); do echo "-- $u"; curl -sL -m 30 "https://www.chelsa-climate.org$u" | grep -o 'https\?://[A-Za-z0-9._/~%?=&#:+-]*' | sort -u | grep -i "envicloud\|zhdk\|chelsa\|s3\|\.tif" | head -15; done
