# Temporary: exact CHELSA v2.1 file names (climatologies and monthly). Deleted after use.
name: Probe CHELSA file names
on:
  push:
    paths: [".github/workflows/probe-chelsa6.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse
          B = "https://os.unil.cloud.switch.ch/chelsa02"
          def ls(prefix, delim="/", n=1000, marker=""):
              u = f"{B}?prefix={urllib.parse.quote(prefix)}&max-keys={n}" + (f"&delimiter={delim}" if delim else "") + (f"&marker={urllib.parse.quote(marker)}" if marker else "")
              x = urllib.request.urlopen(u, timeout=60).read().decode()
              return re.findall(r"<Prefix>([^<]+)</Prefix>", x)[1:], re.findall(r"<Key>([^<]+)</Key>", x), re.findall(r"<Size>(\d+)</Size>", x), "<IsTruncated>true" in x
          for v in ("tasmax", "tasmin", "pr"):
              p = f"chelsa/global/climatologies/{v}/"
              pre, keys, sz, _ = ls(p)
              print("==", p, "subdirs", pre, "files", keys[:4])
              for q in pre:
                  _, k2, s2, _ = ls(q)
                  print("   ", q, len(k2), "files; e.g.", k2[:3], "sizeMB", [round(int(s)/1e6) for s in s2[:3]])
          for v in ("tasmax", "pr"):
              p = f"chelsa/global/monthly/{v}/"
              pre, keys, sz, _ = ls(p)
              print("== monthly", p, "subdirs", pre[:10], "files", keys[:3])
              for q in (pre[:2] + pre[-2:]) if pre else []:
                  _, k2, s2, _ = ls(q)
                  print("   ", q, len(k2), "files; e.g.", k2[:2], k2[-2:], "sizeMB", [round(int(s)/1e6) for s in s2[:2]])
              if not pre:
                  _, k, s, tr = ls(p, delim="", n=1000)
                  yrs = sorted({m for kk in k for m in re.findall(r"_(\d{4})_", kk)})
                  print("   files", len(k), "truncated", tr, "e.g.", k[:2], "years", yrs[:3], yrs[-3:], "sizeMB", [round(int(x)/1e6) for x in s[:2]])
                  _, k, s, tr = ls(p, delim="", n=5, marker=p + "CHELSA_" + v + "_01_2019")
                  print("   around 2019:", k)
          PY
