# Publishes the site to Cloudflare whenever the page (web/) or the data (site/) changes on main.
# Once release-10 data is in place, the page is rebuilt from web/ first, so page edits go live on their own.
name: Deploy site
on:
  push:
    branches: [main]
    paths: ["site/**", "web/**", "worker/**", "wrangler.jsonc"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Build the page from web/
        run: |
          if [ -f site/data/summary.json ]; then
            pip install -r requirements.txt && python -m ctw site
          else
            echo "No release-10 data yet: publishing site/ as it is."
          fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
      - name: Give the Worker its GitHub token (for place requests)
        if: ${{ env.HAS_DISPATCH_TOKEN == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: printf '%s' "$DISPATCH_TOKEN" | npx --yes wrangler@4 secret put DISPATCH_TOKEN
