# Temporary: walks CHELSA's new S3 buckets to find the climatologies folder. Deleted after use.
name: Probe CHELSA bucket layout
on:
  push:
    paths: [".github/workflows/probe-chelsa4.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Walk buckets
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.parse
          def ls(base, prefix="", delim="/", n=1000):
              u = f"{base}?prefix={urllib.parse.quote(prefix)}&delimiter={delim}&max-keys={n}"
              try: x = urllib.request.urlopen(u, timeout=40).read().decode()
              except Exception as e: return [], [], str(e)
              return re.findall(r"<Prefix>([^<]+)</Prefix>", x)[1:] if prefix == "" else re.findall(r"<Prefix>([^<]+)</Prefix>", x)[1:], re.findall(r"<Key>([^<]+)</Key>", x), None
          for base in ("https://os.zhdk.cloud.switch.ch/chelsa01", "https://os.unil.cloud.switch.ch/chelsa02"):
              print("=====", base)
              frontier = [""]
              for depth in range(6):
                  nxt = []
                  for p in frontier:
                      pre, keys, err = ls(base, p)
                      if err: print("ERR", p, err); continue
                      for k in keys[:6]: print("  key", k)
                      for q in pre:
                          if q.count("/") <= 6:
                              nxt.append(q)
                              if any(s in q.lower() for s in ("climatolog", "1981", "1991", "tasmax", "/pr/", "/tas/", "monthly")) or depth < 2:
                                  print("  dir", q)
                  frontier = [q for q in nxt if any(s in q.lower() for s in ("v2", "global", "climatolog", "1981", "1991", "2010", "2020")) or depth < 1][:40]
                  if not frontier: break
          PY
