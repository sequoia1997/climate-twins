# Builds the organism data from the release assets and uploads it to the R2 bucket (served at species.climatetwins.org).
# Run it by pushing a change to .github/run/species-publish, or from the Actions tab.
name: Publish organisms to R2
on:
  workflow_dispatch:
  push:
    paths: [".github/run/species-publish"]
permissions:
  contents: read
concurrency: species-publish
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install --retries 10 --timeout 60 -r requirements-site.txt
      - name: Fetch fits and build
        run: |
          # Every release exists, so a failed download is an error, never "not there yet": publishing without one
          # would quietly drop organisms or put them back on older fits. GitHub sometimes answers 500, so retry.
          fetch() { for i in 1 2 3 4 5; do
              gh release download "$1" --dir work/species-assets --pattern '*_summary.json' --pattern '*_cts.zip' --clobber && return 0
              echo "download of $1 failed (try $i), retrying"; sleep $((i * 20)); done; return 1; }
          for r in species-pilot-data species-fits-batch2 species-data-batch3 species-data-batch4 species-data-batch5 species-data-batch6 species-data-allrange; do
            fetch "$r"
          done
          python -m ctw.species_site build --src work/species-assets --out work/r2
          du -sh work/r2; find work/r2 -type f | wc -l
          python - <<'PY'
          import json, collections as C
          d = json.load(open("work/r2/index.json"))["species"]
          print("published:", len(d))
          print("by group:", dict(C.Counter(r["group"] for r in d)))
          print("tier:", dict(C.Counter(r["tier"] for r in d)), "confidence:", dict(C.Counter(r["confidence"] for r in d)))
          print("range shifts:", dict(C.Counter(r["range_shifts"] for r in d)))
          PY
          # never publish fewer organisms than are live (a missing input would otherwise shrink the site)
          python - <<'PY'
          import json, urllib.request
          new = len(json.load(open("work/r2/index.json"))["species"])
          try:
              rq = urllib.request.Request("https://species.climatetwins.org/index.json", headers={"User-Agent": "climate-twins-publish (GitHub Actions)"})
              live = len(json.load(urllib.request.urlopen(rq, timeout=60))["species"])   # Cloudflare refuses Python's default user agent
          except Exception as e:
              raise SystemExit(f"could not read the live index to compare ({e}); not publishing")
          print(f"live {live}, new {new}")
          if new < live:
              raise SystemExit(f"the new build has {new} organisms, fewer than the {live} live; not publishing")
          PY
      - name: Upload (hashed files first, index last)
        run: |
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync work/r2 "s3://${R2_BUCKET}" --endpoint-url "$EP" --exclude index.json \
            --cache-control "public, max-age=31536000, immutable" --no-progress | tail -3
          aws s3 cp work/r2/index.json "s3://${R2_BUCKET}/index.json" --endpoint-url "$EP" \
            --content-type application/json --cache-control "public, max-age=300"
      - name: Check the public domain
        run: |
          curl -sSf -H "Origin: https://climatetwins.org" -D - -o /tmp/i.json https://species.climatetwins.org/index.json | head -12
          python -c "import json;d=json.load(open('/tmp/i.json'));print(len(d['species']),'organisms public')"
