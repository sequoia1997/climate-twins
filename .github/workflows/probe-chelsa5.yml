# Temporary: find CHELSA v2.1 monthly climatologies on the new host. Deleted after use.
name: Probe CHELSA new bucket
on:
  push:
    paths: [".github/workflows/probe-chelsa5.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Walk
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse
          def ls(base, prefix):
              u = f"{base}?prefix={urllib.parse.quote(prefix)}&delimiter=/&max-keys=1000"
              try: x = urllib.request.urlopen(u, timeout=40).read().decode()
              except Exception as e: return None, str(e)
              return (re.findall(r"<Prefix>([^<]+)</Prefix>", x)[1:], re.findall(r"<Key>([^<]+)</Key>", x)), None
          for base in ("https://os.zhdk.cloud.switch.ch/chelsa01", "https://os.unil.cloud.switch.ch/chelsa02", "https://os.zhdk.cloud.switch.ch/chelsav1"):
              print("=====", base)
              frontier, seen = [""], 0
              for depth in range(7):
                  nxt = []
                  for p in frontier:
                      r, err = ls(base, p)
                      if err: print("ERR", repr(p), err); continue
                      pre, keys = r
                      if keys: print(f"  {p}  ({len(keys)} files) e.g. {keys[:3]}")
                      for q in pre:
                          print("  dir", q) if depth < 3 or re.search(r"clim|1981|1991|tas|/pr/", q, re.I) else None
                          nxt.append(q)
                  frontier = [q for q in nxt if depth < 2 or re.search(r"v2|global|clim|1981|1991|2010|2020|tas|/pr/", q, re.I)][:60]
                  if not frontier: break
          PY
