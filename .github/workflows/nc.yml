# CC BY-NC records for 180 organisms (data/species/nc_species.csv).
# Trigger: push to .github/run/nc. One small GBIF download; output nc_occ_cells_v1.parquet on the release species-data-allrange.
name: nc
on:
  push:
    paths: [".github/run/nc"]
permissions:
  contents: write
env:
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}
jobs:
  nc:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pyarrow
      - name: Request, wait, fetch, clean
        env:
          GBIF_USER: ${{ secrets.GBIF_USER }}
          GBIF_PWD: ${{ secrets.GBIF_PWD }}
          GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}
          W2_TAG: species-data-allrange
          W2_EXTRA_TAGS: species-pilot-data
        run: python -m ctw.species.ncrun
      - name: Upload
        run: |
          for i in 1 2 3 4; do gh release upload species-data-allrange nc_occ_cells_v1.parquet nc_downloads_v1.json --clobber && break; sleep 15; done
