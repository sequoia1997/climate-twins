# Rebuilds all Climate Twins data from the original sources and opens a pull request with the result and a
# check report. Runs every year in March (TerraClimate adds the previous year early in the year) and on demand.
# Nothing goes live until the pull request is merged; merging triggers deploy.yml.
name: Rebuild data
on:
  schedule:
    - cron: "0 7 15 3 *"
  workflow_dispatch:
    inputs:
      smoke:
        description: "Quick test run (2 models, 12 places, few years) - opens no pull request"
        type: boolean
        default: false
      extra:
        description: "Try extra matched variables, comma-separated (pet, srad); the report gets a sensitivity note. Empty = config.toml"
        type: string
        default: ""
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: rebuild
  cancel-in-progress: false
env:
  CTW_WORK: ${{ github.workspace }}/work
  CTW_SMOKE: ${{ inputs.smoke && '1' || '' }}
  CTW_EXTRA: ${{ inputs.extra }}
  PYTHONUNBUFFERED: "1"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.p.outputs.models }}
      latest: ${{ steps.p.outputs.latest }}
      tcvars: ${{ steps.p.outputs.tcvars }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - id: p
        run: |
          python -m ctw plan > plan.json
          echo "models=$(python -c 'import json;print(json.dumps(json.load(open("plan.json"))["models"]))')" >> "$GITHUB_OUTPUT"
          echo "tcvars=$(python -c 'import json;print(json.dumps(json.load(open("plan.json"))["tc_vars"]))')" >> "$GITHUB_OUTPUT"
          echo "latest=$(python -c 'import json;print(json.load(open("plan.json"))["latest_year"])')" >> "$GITHUB_OUTPUT"

  cmip6:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        model: ${{ fromJson(needs.plan.outputs.models) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m ctw cmip6 --model "${{ matrix.model }}"
      - uses: actions/upload-artifact@v6
        with: { name: "cmip6-${{ matrix.model }}", path: work/cmip6/*.npz, retention-days: 7 }

  terraclimate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CTW_TC_LATEST: ${{ needs.plan.outputs.latest }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        var: ${{ fromJson(needs.plan.outputs.tcvars) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m ctw terraclimate --var ${{ matrix.var }}
      - uses: actions/upload-artifact@v6
        with: { name: "tc-${{ matrix.var }}", path: work/terraclimate/*.npz, retention-days: 7 }

  north-america:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m ctw adaptwest
      - run: python -m ctw prism
      - run: python -m ctw gazetteer
      - uses: actions/upload-artifact@v6
        with:
          name: na-inputs
          retention-days: 7
          path: |
            work/adaptwest.npz
            work/prism.npz
            work/gazetteer.json
            work/downloads/ne_50m_countries.geojson

  sealevel:
    # IPCC AR6 projections do not change between assessments: fetched once, then kept in data/sealevel.json (fetched again only when the place lists have changed).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m ctw sealevel --if-stale
      - uses: actions/upload-artifact@v6
        with: { name: sealevel, path: data/sealevel.json, if-no-files-found: ignore, retention-days: 7 }

  era5:
    # Independent cross-check and hindcast input: ERA5 daily fields from Google Cloud (about 8 s per year and variable).
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        var: [tmax, tmin, ppt, vap]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m ctw era5 --var ${{ matrix.var }}
      - uses: actions/upload-artifact@v6
        with: { name: "era5-${{ matrix.var }}", path: work/era5/*.npz, retention-days: 7 }

  chirps:
    # Independent precipitation cross-check: CHIRPS v2.0 monthly GeoTIFFs (14 MB each), one at a time, sampled at every place and deleted.
    # Six parts of five years, in parallel (about 60-72 files per job).
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m ctw chirps --part ${{ matrix.part }} --of 6
      - uses: actions/upload-artifact@v6
        with: { name: "chirps-${{ matrix.part }}", path: work/chirps/part*.npz, if-no-files-found: ignore, retention-days: 7 }

  chelsa:
    # Independent temperature and precipitation cross-check: CHELSA v2.1 1981-2010 monthly normals, one file at a time, sampled and deleted.
    # DISABLED: the download host (os.zhdk.ch) does not resolve, even from GitHub runners (checked 2026-09-29). Remove the
    # `if: false` line if it returns; the analysis step already skips the source when no CHELSA files exist.
    if: false
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        var: [tasmax, tasmin, pr]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m ctw chelsa --var ${{ matrix.var }}
      - uses: actions/upload-artifact@v6
        with: { name: "chelsa-${{ matrix.var }}", path: work/chelsa/*.npz, retention-days: 7 }

  hindcast:
    needs: era5
    if: ${{ !cancelled() && needs.era5.result == 'success' && !inputs.smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with: { pattern: "era5-*", path: work/era5, merge-multiple: true }
      - run: python -m ctw hindcast
      - uses: actions/upload-artifact@v6
        with: { name: hindcast, path: data/hindcast.json, retention-days: 7 }

  analyze:
    needs: [cmip6, terraclimate, north-america, sealevel, era5, chirps, chelsa, hindcast]
    if: ${{ !cancelled() && needs.cmip6.result == 'success' && needs.terraclimate.result == 'success' && needs.north-america.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with: { pattern: "cmip6-*", path: work/cmip6, merge-multiple: true }
      - uses: actions/download-artifact@v7
        with: { pattern: "tc-*", path: work/terraclimate, merge-multiple: true }
      - uses: actions/download-artifact@v7
        with: { name: na-inputs, path: work }
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with: { name: sealevel, path: data }
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with: { pattern: "era5-*", path: work/era5, merge-multiple: true }
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with: { pattern: "chirps-*", path: work/chirps, merge-multiple: true }
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with: { pattern: "chelsa-*", path: work/chelsa, merge-multiple: true }
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with: { name: hindcast, path: data }
      - name: Keep the current release's summary for comparison
        run: cp site/data/summary.json /tmp/previous_summary.json 2>/dev/null || true
      - run: python -m ctw analogs
      - name: Model-resolution check (NEX-GDDP, WorldClim, AdaptWest changes vs main; skipped if no delta file exists)
        continue-on-error: true
        run: python -m ctw nexcheck
      - run: python -m ctw export
      - run: python -m ctw site
      - name: Check the build
        id: check
        run: |
          prev=""; [ -f /tmp/previous_summary.json ] && prev="--previous /tmp/previous_summary.json"
          python -m ctw validate $prev
          echo "status=$(cat site/data/status.txt)" >> "$GITHUB_OUTPUT"
      - name: Record the data update in the changelog
        if: ${{ env.CTW_SMOKE == '' }}
        run: python -m ctw changelog && python -m ctw site
      - name: Test the page in a browser
        run: |
          pip install playwright && python -m playwright install --with-deps chromium
          python tests/test_page.py site
      - uses: actions/upload-artifact@v6
        with: { name: site, path: site, retention-days: 30 }
      - name: Open a pull request
        if: ${{ env.CTW_SMOKE == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python -c "import json;print(json.load(open('site/data/summary.json'))['data_version'])")
          b="data-update-$v"
          git config user.name "climate-twins-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -b "$b"
          git add site CHANGELOG.md data/sealevel.json data/hindcast.json 2>/dev/null || git add site CHANGELOG.md
          git commit -m "Data update $v (${{ steps.check.outputs.status }})"
          git push -f origin "$b"
          label="${{ steps.check.outputs.status }}"
          gh label create "$label" --force >/dev/null 2>&1 || true
          gh pr create --title "Data update $v: ${label/routine/routine update}" --body-file site/data/report.md --label "$label" --base main --head "$b" \
            || gh pr edit "$b" --body-file site/data/report.md

  report-failure:
    needs: [analyze]
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "${{ github.repository }}" --title "Data rebuild failed ($(date +%F))" \
            --body "The yearly rebuild did not finish. Open the run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The live site is unchanged."
