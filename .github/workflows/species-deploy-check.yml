# Temporary: tests the species deploy step without publishing anything. Delete after the check.
name: Species deploy check
on:
  push:
    paths: [".github/run/species-deploy-check"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install --retries 10 --timeout 60 -r requirements-site.txt
          time gh release download species-pilot-data --dir work/species-assets --pattern 'w3_*_summary.json' --pattern 'w3_*_cts.zip' --pattern 's1_*_summary.json' --pattern 's1_*_cts.zip'
          ls work/species-assets | wc -l; du -sh work/species-assets
          time python -m ctw.species_site build --src work/species-assets --out site/species/data
          du -sh site/species/data; find site/species/data -type f | wc -l
          find site/species/data -type f -size +10M | head
          python - <<'PY'
          import json,glob
          i=json.load(open(glob.glob("site/species/data/index.json")[0]))
          sp=i.get("species",i)
          print("species in index:",len(sp))
          PY
