# SPIKE D: build the species candidate list from iNaturalist, GBIF and Wikipedia pageviews (public APIs, no credentials).
name: Spike D candidates
on:
  push:
    paths: [".github/run/spike-d"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 285
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Seed cache from the cancelled first run (once)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: spike-d-species
          run-id: "37527131651"
          github-token: ${{ github.token }}
          path: seed-cache
      - uses: actions/cache/restore@v4
        id: rc
        with:
          path: work-spike-d
          key: spike-d-cache-none
          restore-keys: spike-d-cache-
      - name: Use seed cache if no newer cache
        run: |
          mkdir -p work-spike-d
          [ -f work-spike-d/cache.json ] || { [ -f seed-cache/work-spike-d/cache.json ] && cp seed-cache/work-spike-d/cache.json work-spike-d/cache.json; } || true
          ls -la work-spike-d
      - name: Build candidates
        run: python scripts/spike_d/build_candidates.py --outdir data/species --work work-spike-d
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: work-spike-d
          key: spike-d-cache-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-d-species
          path: |
            data/species/
            work-spike-d/cache.json
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/species/candidates.csv data/species/shortlist_v1.csv data/species/excluded_pool.csv data/species/build_stats.json
          git diff --cached --quiet && exit 0
          git commit -m "spike D: species candidates from public popularity signals"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
