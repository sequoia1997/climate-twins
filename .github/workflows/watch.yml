# Once a month: is there a new TerraClimate year, a corrected or withdrawn CMIP6 dataset, or CMIP7 data?
# Opens or updates one issue when something needs attention. Changes nothing on its own.
name: Watch upstream data
on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - id: w
        run: python -m ctw watch
      - if: steps.w.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --label upstream --state open --json number -q '.[0].number')
          gh label create upstream --force >/dev/null 2>&1 || true
          if [ -n "$n" ]; then gh issue comment "$n" --body-file watch_report.md
          else gh issue create --title "Upstream data changed" --label upstream --body-file watch_report.md; fi
