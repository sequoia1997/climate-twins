# Temporary: checks which public climate-data hosts the Actions runners can reach. Deleted after use.
name: Probe data hosts
on:
  push:
    paths: [".github/workflows/probe-hosts.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          probe() { printf "%-95s " "$1"; curl -sIL -m 25 -o /dev/null -w "%{http_code} %{size_download} bytes  type=%{content_type} len=%header{content-length}\n" "$1" || echo FAIL; }
          probe https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_bio.zip
          probe https://geodata.ucdavis.edu/cmip6/10m/MIROC6/ssp245/wc2.1_10m_tmax_MIROC6_ssp245_2041-2060.tif
          probe https://os.zhdk.ch/envicloud/chelsa/chelsa_V2/GLOBAL/climatologies/1981-2010/tas/CHELSA_tas_01_1981-2010_V.2.1.tif
          probe https://data.chc.ucsb.edu/products/CHIRPS-2.0/global_monthly/tifs/chirps-v2.0.1991.01.tif.gz
          probe https://data.chc.ucsb.edu/products/CHIRPS-2.0/global_monthly/netcdf/chirps-v2.0.monthly.nc
          probe https://s3-us-west-2.amazonaws.com/www.cacpd.org/CMIP6v73/normals/Normal_1991_2020_monthly.zip
          probe https://s3-us-west-2.amazonaws.com/www.cacpd.org/CMIP6v73/
          probe https://cds.climate.copernicus.eu/api
          probe https://climate.northwestknowledge.net/TERRACLIMATE-DATA/TerraClimate_tmax_2020.nc
          probe https://download.geonames.org/export/dump/cities500.zip
          probe https://zenodo.org/records/5914710/files/ar6-regional-confidence.zip
          probe https://cruts.ceda.ac.uk/
          probe https://crudata.uea.ac.uk/cru/data/hrg/cru_ts_4.09/cruts.2503051245.v4.09/tmp/
          probe https://data.isimip.org/
          probe https://nex-gddp-cmip6.s3-us-west-2.amazonaws.com/index.html
          probe https://loca2.ucsd.edu/
          probe https://cmip6-pds.s3.amazonaws.com/index.html
          probe https://storage.googleapis.com/cmip6/pangeo-cmip6.csv
          probe https://www.ncei.noaa.gov/pub/data/cmb/ersst/v5/netcdf/
          probe https://data.giss.nasa.gov/pub/gistemp/gistemp1200_GHCNv4_ERSSTv5.nc.gz
