# W2 production run: GBIF downloads (resumable, state in the release species-pilot-data), cleaning to 1/24 degree cells, target-group SQL
# downloads. Push a change to .github/run/pilot-w2 with [acquire] or [assemble] in the commit message, or run by hand.
# Secrets reach only the steps that call GBIF; nothing prints them.
name: pilot-w2-run
on:
  push:
    paths: [".github/run/pilot-w2"]
  workflow_dispatch:
    inputs:
      stage:
        description: "acquire | assemble"
        type: string
        default: "acquire"
permissions:
  contents: write
concurrency:
  group: pilot-w2-run
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  W2_WORK: ${{ github.workspace }}/work/w2
  W2_TMP: ${{ runner.temp }}
jobs:
  acquire:
    if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'acquire') || contains(github.event.head_commit.message, '[acquire]')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pyarrow
      - name: Request, wait, fetch, clean, store (resumable)
        env:
          GBIF_USER: ${{ secrets.GBIF_USER }}
          GBIF_PWD: ${{ secrets.GBIF_PWD }}
          GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}
        run: python -m ctw.species.w2run acquire --hours 5.6
      - name: State (keys and DOIs, no secrets)
        if: always()
        run: |
          cat work/w2/acquire_summary.json || true
          python - <<'PY'
          import json
          d=json.load(open("work/w2/w2-state.json"))
          print(json.dumps({k:{x:v.get(x) for x in ("key","doi","records","status","processed")} for k,v in d.items() if not k.startswith("_")}))
          PY
  assemble:
    if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'assemble') || contains(github.event.head_commit.message, '[assemble]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pyarrow
      - name: Masks, flags, time split, publish assets
        run: python -m ctw.species.w2run assemble
      - run: cat work/w2/final/manifest_w2_v1.json
        if: always()
