# Spike B probe 2: CHELSA layout, TerraClimate chunking and range reads, GeoTIFF range reads.
name: Spike B probe 2
on:
  push:
    paths: [".github/run/spike-b"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q numpy h5py fsspec aiohttp requests
      - run: python -u ctw/species/spike_b_probe2.py
