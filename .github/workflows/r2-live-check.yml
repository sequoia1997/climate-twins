# Temporary: checks the live species page and the R2 bucket (credentials, write, public domain, CORS). Prints no secrets.
name: R2 and live check
on:
  push:
    paths: [".github/run/r2-check"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Live site
        run: |
          for u in https://climatetwins.org/ https://climatetwins.org/species.html https://climatetwins.org/species/data/index.json https://climatetwins.org/species-methods.html; do
            curl -s -o /tmp/o -w "$u -> %{http_code} %{size_download} bytes\n" "$u"
          done
          curl -s https://climatetwins.org/species/data/index.json | python3 -c "import sys,json; j=json.load(sys.stdin); s=j.get('species',j); print('species in live index:', len(s))" || echo "index not readable"
      - name: Secret lengths only (no values)
        run: |
          echo "access key id length: ${#AWS_ACCESS_KEY_ID}"; echo "secret key length: ${#AWS_SECRET_ACCESS_KEY}"; echo "account id length: ${#R2_ACCOUNT_ID}"; echo "bucket name set: $([ -n "$R2_BUCKET" ] && echo yes || echo no)"
      - name: R2 list, write, read, delete
        run: |
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws --version
          aws s3 ls "s3://${R2_BUCKET}" --endpoint-url "$EP" 2>&1 | head -5 && echo "list ok"
          echo "ok $(date -u)" > /tmp/ok.txt
          aws s3 cp /tmp/ok.txt "s3://${R2_BUCKET}/_check/ok.txt" --endpoint-url "$EP" --content-type text/plain 2>&1 | tail -2 && echo "write ok"
          aws s3 rm "s3://${R2_BUCKET}/_check/ok.txt" --endpoint-url "$EP" >/dev/null 2>&1 || true
      - name: Public domain and CORS
        run: |
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp /tmp/ok.txt "s3://${R2_BUCKET}/_check/ok.txt" --endpoint-url "$EP" --content-type text/plain >/dev/null 2>&1 || true
          for d in species.climatetwins.org; do
            echo "== $d"
            curl -s -D - -o /dev/null -H "Origin: https://climatetwins.org" -H "Range: bytes=0-3" "https://$d/_check/ok.txt" | grep -i -E "^HTTP|access-control|content-range|content-length|cf-cache|server" 
          done
          aws s3api get-bucket-cors --bucket "$R2_BUCKET" --endpoint-url "$EP" 2>&1 | head -20 || true
          aws s3 rm "s3://${R2_BUCKET}/_check/ok.txt" --endpoint-url "$EP" >/dev/null 2>&1 || true
