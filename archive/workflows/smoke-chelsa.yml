# Smoke test for the CHELSA v2.1 extraction (ctw/baselines.py). Runs on push of this file only, or by hand.
# First a reachability probe (HEAD, range GET, plain GET of the first bytes), then two months of tasmax, tasmin and pr at 12 places.
# If the probe fails the extraction is not attempted and the workflow fails: CHELSA is then dropped from the design.
name: Smoke CHELSA
on:
  push:
    paths: [".github/workflows/smoke-chelsa.yml"]
  workflow_dispatch:
jobs:
  chelsa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      BASE: https://os.unil.cloud.switch.ch/chelsa02/chelsa/global/climatologies
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Probe reachability (HEAD, range GET, GET)
        run: |
          u="$BASE/tasmax/1981-2010/CHELSA_tasmax_01_1981-2010_V.2.1.tif"
          echo "--- HEAD"; curl -sSI --max-time 60 "$u" | head -15 || true
          echo "--- range GET bytes 0-1023"
          curl -sS --max-time 60 -r 0-1023 -o /tmp/r.bin -w "HTTP %{http_code}, %{size_download} bytes\n" "$u" || true
          head -c 8 /tmp/r.bin | xxd | head -2 || true
          echo "--- plain GET for 15 s (timeout expected; shows throughput)"
          curl -sS --max-time 15 -o /tmp/g.bin -w "HTTP %{http_code}, %{size_download} bytes\n" "$u" || true
          echo "--- other variables"
          for v in tasmin pr; do curl -sS --max-time 60 -r 0-1023 -o /dev/null -w "$v: HTTP %{http_code}\n" "$BASE/$v/1981-2010/CHELSA_${v}_07_1981-2010_V.2.1.tif" || true; done
      - name: Two months (Jan, Jul) of tasmax, tasmin, pr at 12 places
        env:
          CTW_WORK: ${{ github.workspace }}/work-smoke
          CTW_SMOKE: "1"
          CTW_CHELSA_MONTHS: "1,7"
        run: |
          start=$(date +%s)
          for v in tasmax tasmin pr; do python -m ctw chelsa --var $v; df -h . | tail -1; done
          echo "elapsed $(( $(date +%s) - start )) s"
          python -m ctw.smoke_baselines chelsa
