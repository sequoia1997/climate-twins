<style>
:root{--bg:#f3f5f6;--panel:#fff;--ink:#1d2730;--muted:#5b6670;--rule:#d8dde1;--accent:#d6412c;--chip:#eef1f3;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-head:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11181e;--panel:#172028;--ink:#e7ecef;--muted:#9aa6b0;--rule:#2c3943;--accent:#ff6b4a;--chip:#1d2831}}
:root[data-theme="dark"]{--bg:#11181e;--panel:#172028;--ink:#e7ecef;--muted:#9aa6b0;--rule:#2c3943;--accent:#ff6b4a;--chip:#1d2831}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--font-body)}
main{max-width:720px;margin:0 auto;padding:28px 22px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:.92rem;margin-bottom:26px}
a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:3px}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:3px}
.brand{font:700 1rem var(--font-head);text-decoration:none}
h1{font:700 clamp(2rem,6vw,2.7rem)/1.08 var(--font-head);margin:0 0 10px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 30px}
h2{font:700 1.3rem/1.3 var(--font-head);margin:34px 0 10px;padding-top:18px;border-top:1px solid var(--rule)}
h3{font:700 1.05rem var(--font-head);margin:20px 0 6px}
ul{margin:0;padding-left:1.2em} li{margin:0 0 10px} li::marker{color:var(--muted)}
code{font-size:.9em;background:var(--chip);border-radius:4px;padding:1px 5px}
footer{margin-top:42px;padding-top:18px;border-top:1px solid var(--rule);font-size:.92rem;color:var(--muted)}
</style>
</head>

</body>
